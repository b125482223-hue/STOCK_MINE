<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>台股盤後籌碼儀表板</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily Market Close</p>
          <h1>台股盤後籌碼儀表板</h1>
        </div>
        <div class="status-panel">
          <span id="dataStatus" class="status-pill">載入中</span>
          <span id="updatedAt" class="muted">資料日期：--</span>
          <button id="refreshButton" class="icon-button" type="button" title="重新整理" aria-label="重新整理">↻</button>
        </div>
      </header>

      <section class="summary-grid three" aria-label="盤後摘要">
        <article class="metric-card strong">
          <span class="metric-label">每日三大法人買賣超</span>
          <strong id="institutionalTotal">--</strong>
          <span class="muted">大盤 + 櫃買合計</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">三大法人未平倉</span>
          <strong id="futuresTotal">--</strong>
          <span class="muted">期貨多空淨額合計</span>
        </article>
        <article class="metric-card">
          <span class="metric-label">每日信用交易變化</span>
          <strong id="creditTotal">--</strong>
          <span class="muted">融資餘額變化合計</span>
        </article>
      </section>

      <section id="sourceIssues" class="notice" hidden></section>

      <section class="content-grid">
        <article class="panel full">
          <div class="panel-header">
            <h2>每日三大法人買賣超</h2>
            <span class="muted">大盤與櫃買</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>市場</th>
                  <th>外資</th>
                  <th>投信</th>
                  <th>自營商</th>
                  <th>合計</th>
                </tr>
              </thead>
              <tbody id="institutionalRows"></tbody>
            </table>
          </div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>三大法人未平倉</h2>
            <span class="muted">期貨多空淨額</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>身份別</th>
                  <th>多方未平倉</th>
                  <th>空方未平倉</th>
                  <th>多空淨額</th>
                </tr>
              </thead>
              <tbody id="futuresRows"></tbody>
            </table>
          </div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>每日信用交易變化</h2>
            <span class="muted">融資融券市場合計</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>市場</th>
                  <th>融資餘額</th>
                  <th>融資變化</th>
                  <th>融券餘額</th>
                  <th>融券變化</th>
                </tr>
              </thead>
              <tbody id="creditRows"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <script src="assets/app.js"></script>
  </body>
</html>
