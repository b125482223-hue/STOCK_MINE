name: Update market data

on:
  schedule:
    # 14:50 Asia/Taipei (UTC+8): first institutional-data attempt.
    - cron: "50 6 * * 1-5"
    # 11:47-17:17 Asia/Taipei every 30 minutes. Pre-queue off the hour to absorb
    # GitHub-hosted schedule delays while retaining retries after publication.
    - cron: "47 3-8 * * 1-5"
    - cron: "17 4-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build daily data
        run: node tools/build_daily_data.js
        env:
          MARKET_UPDATE_TRIGGER: ${{ github.event_name }}
          MARKET_SCHEDULE: ${{ github.event.schedule }}

      - name: Report dashboard freshness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("data/latest/market-dashboard.json", "utf8"));
          const history = JSON.parse(fs.readFileSync("data/logs/api-call-history.json", "utf8"));
          const latestRun = history.entries[0];
          const issues = data.sourceIssues?.length ? data.sourceIssues.join("; ") : "none";
          const availableCalls = latestRun.calls.filter((call) => call.dataAvailable).length;
          const report = `Dashboard date: ${data.asOf}\nGenerated at: ${data.generatedAt}\nUpdate stage: ${data.updateStatus?.stage || "unknown"}\nAPI data available: ${availableCalls}/${latestRun.calls.length}\nSource issues: ${issues}`;
          console.log(report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Market data result\n\n${report.replaceAll("\n", "  \n")}\n`);
          NODE

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/market-dashboard.json data/logs/api-call-history.json
          git diff --cached --quiet || git commit -m "chore: update daily market data"
          git push
