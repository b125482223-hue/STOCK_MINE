name: Update market data

on:
  schedule:
    # 14:50, 15:00, 15:05 Asia/Taipei (UTC+8): institutional and futures data.
    - cron: "50 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "5 7 * * 1-5"
    # 21:30, 21:35, 21:40 Asia/Taipei (UTC+8): credit-trading data follow-up.
    - cron: "30 13 * * 1-5"
    - cron: "35 13 * * 1-5"
    - cron: "40 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build daily data
        run: node tools/build_daily_data.js

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/market-dashboard.json
          git diff --cached --quiet || git commit -m "chore: update daily market data"
          git push
