name: Update market data

on:
  schedule:
    # 21:00 Asia/Taipei (UTC+8); wait for the evening credit-trading release.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build daily data
        run: node tools/build_daily_data.js

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/market-dashboard.json
          git diff --cached --quiet || git commit -m "chore: update daily market data"
          git push
