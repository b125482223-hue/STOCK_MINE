name: Update market data

on:
  schedule:
    # 14:50 Asia/Taipei (UTC+8): first institutional-data attempt.
    - cron: "50 6 * * 1-5"
    # 15:00-16:50 every 10 minutes, plus 17:00: retry delayed TWSE/TAIFEX publication.
    - cron: "*/10 7-8 * * 1-5"
    - cron: "0 9 * * 1-5"
    # 21:30-22:30 every 10 minutes: retry delayed credit-trading publication.
    - cron: "30,40,50 13 * * 1-5"
    - cron: "0,10,20,30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build daily data
        run: node tools/build_daily_data.js

      - name: Report dashboard freshness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("data/latest/market-dashboard.json", "utf8"));
          const issues = data.sourceIssues?.length ? data.sourceIssues.join("; ") : "none";
          const report = `Dashboard date: ${data.asOf}\nUpdate stage: ${data.updateStatus?.stage || "unknown"}\nSource issues: ${issues}`;
          console.log(report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Market data result\n\n${report.replaceAll("\n", "  \n")}\n`);
          NODE

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/market-dashboard.json
          git diff --cached --quiet || git commit -m "chore: update daily market data"
          git push
